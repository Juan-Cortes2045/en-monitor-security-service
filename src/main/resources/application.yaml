spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: security-service

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    # Only the security changesets. The schema is shared with energy-monitor-backend (ADR-003),
    # and so is the DATABASECHANGELOG table: each service applies its own changelogs.
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Message broker of the account events and the mail requests (RabbitMQ, from infra).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:energy-monitor}
    password: ${RABBITMQ_PASSWORD:}
    # A message is marked as published only after the broker confirms it and a queue took it.
    publisher-confirm-type: simple
    publisher-returns: true
    template:
      mandatory: true

server:
  # 8080 is the API gateway and 8083 energy-monitor-backend when all run on the same machine.
  port: ${SERVER_PORT:8082}
  # Requests come through the API gateway: from it (loopback or a private network) the container
  # takes the caller's address from X-Forwarded-For, which the audit trail and the recovery
  # attempt limit record.
  forward-headers-strategy: native
  tomcat:
    # Only loopback (the gateway or nginx on this machine) and the Docker networks may set it: the
    # default would trust every private network, and a machine of the LAN could then pass as
    # 127.0.0.1.
    remoteip:
      internal-proxies: "127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}"

messaging:
  # Topic exchange of everything this service announces; the routing keys are the message types
  # (account.registered, account.administered, account.deleted, mail.email-verification,
  # mail.password-reset).
  exchange: energy-monitor.security
  # The outbox relay: every second, up to 50 messages, each confirmed by the broker within 5 s.
  relay-enabled: true
  poll-interval: PT1S
  batch-size: 50
  confirm-timeout: PT5S

# Calls between this service and energy-monitor-backend, both ways. Each side checks the other's
# network and the shared token; the reverse proxy never forwards /internal/**.
internal-api:
  # Same value in both services. Empty refuses every inbound internal call.
  # Generate with: openssl rand -hex 32
  token: ${INTERNAL_API_TOKEN:}
  allowed-networks: ${INTERNAL_API_ALLOWED_NETWORKS:127.0.0.1/32,::1/128,172.16.0.0/12}
  # Asked before deleting an account (GET /internal/accounts/{id}/deletion-check). No answer
  # within the timeouts refuses the deletion with 503.
  backend-url: ${BACKEND_INTERNAL_URL:http://localhost:8083}
  connect-timeout: PT1S
  read-timeout: PT2S

security:
  google:
    # OAuth client of type "Web application" (Google Cloud Console). Both empty = the
    # "Sign in with Google" button answers 503. The secret never leaves the server.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  jwt:
    # The iss claim. It keeps the value the monolith used, because every other service validates
    # it on the tokens this one issues, and the sessions open before the split must stay valid.
    issuer: https://energy-monitor-backend
    access-token-ttl: 15m
    private-key-path: ${SECURITY_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${SECURITY_JWT_PUBLIC_KEY_PATH:}

  email-domain-check:
    # Registration refuses an address whose domain does not exist or publishes no mail server
    # (MX) nor address (A/AAAA), e.g. a mistyped "gmial.con". When DNS cannot be reached the
    # address is let through: the verification code still has to arrive.
    enabled: ${SECURITY_EMAIL_DOMAIN_CHECK_ENABLED:true}

  session-cookie:
    # The web app receives its tokens in HttpOnly cookies (X-Session-Transport: cookie). Secure
    # is what a deployment behind HTTPS needs; the local stack and development mode serve plain
    # HTTP, set SECURITY_SESSION_COOKIE_SECURE=false, or the browser drops the cookies.
    secure: ${SECURITY_SESSION_COOKIE_SECURE:true}
    # Lifetime of the refresh cookie: the same seven days as the refresh token.
    refresh-max-age: 7d

  reset:
    # Pepper for the password-recovery code, as HMAC-SHA256(code, pepper). The recovery code is
    # six digits, so a plain digest of it is reversible from a database dump in seconds: one
    # million candidates, all cheap to hash. The pepper is what stops that, because it lives in
    # the configuration rather than in the table, so a leaked dump yields nothing usable.
    #
    # The application refuses to start without it, exactly as it does for the signing key: a
    # recovery secret protected by a guessable pepper is not protected.
    #
    # Changing it invalidates every code already issued. Generate with:
    #   openssl rand -hex 32
    pepper: ${SECURITY_RESET_PEPPER:}
    # Six digits: what a person can read off a screen and type back without an error. Fewer
    # digits would be more comfortable to type and no safer, because the rate limit is what
    # bounds guessing, not the size of the space.
    code-digits: 6
    # How long a freshly issued code stays redeemable.
    code-validity: 15m
    # How many redemption attempts one caller address may make per window. This is the control
    # that makes a six-digit code defensible: a million combinations is few enough to exhaust by
    # brute force over the network, and the answer to that is to make the network slow.
    max-attempts-per-window: 10
    attempt-window: 15m
    # Queue that recovery requests are dispatched onto. The endpoint answers 202 before this work
    # runs, which is what removes the timing difference between a registered address and an
    # unregistered one, so the queue is part of the endpoint's behaviour and not of mail delivery.
    # Bounded, so pressure becomes refused work rather than memory behind an endpoint that keeps
    # answering. A refusal is still answered 202: a full queue must not tell a caller whether the
    # account exists.
    executor:
      worker-threads: 2
      queue-capacity: 100

  cors:
    # The origins allowed to call this API from a browser, comma separated. Empty by default,
    # which means no cross-origin caller is answered at all: fail closed until a deployment
    # states its own. '*' is deliberately not offered as a default and is refused together with
    # allow-credentials, because the Fetch specification rejects that combination outright.
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
    # Wildcard origin patterns, kept separate from allowed-origins because Spring only tolerates a
    # wildcard in this list and echoes the concrete origin back rather than the pattern itself.
    allowed-origin-patterns: ${SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}
    allowed-headers: Authorization,Content-Type,Accept
    allow-credentials: false
    max-age: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
